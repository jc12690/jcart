<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages serves this page for any address that doesn't exist, at that
     address, so everything here links from the site root ("/..."), never
     relative to the page. Edited by hand. -->
<title>Page Not Found · Jarred Carter</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico?v=3" sizes="32x32">
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
<script>try{if(localStorage.getItem("jc-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<script>
(function(){
  /* Google Analytics ran on this site until September 2026 and left _ga cookies
     in returning visitors' browsers, plus a jc-consent record from the banner
     that gated it. Nothing reads either any more, so expire them. This block can
     be deleted after the end of 2028, by which point the cookies would have
     expired on their own. */
  try{
    var parts=location.hostname.split("."),domains=[""];
    for(var i=0;i<parts.length-1;i++)domains.push("."+parts.slice(i).join("."));
    document.cookie.split(";").forEach(function(pair){
      var n=pair.split("=")[0].trim();
      if(n==="_ga"||n.indexOf("_ga_")===0||n==="_gid"||n.indexOf("_gat")===0){
        domains.forEach(function(d){
          document.cookie=n+"=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/"+(d?"; domain="+d:"");
        });
      }
    });
    localStorage.removeItem("jc-consent");
  }catch(e){}

  /* Cloudflare Web Analytics. It sets no cookies and stores nothing on the
     visitor's device, so this site needs no consent banner. Gated to the
     production hostname so local development and forks never reach the real
     dashboard. The token is public by design and visible in the page source. */
  var h=location.hostname;
  if(h==="jarredmcarter.com"||h==="www.jarredmcarter.com"){
    var b=document.createElement("script");
    b.type="module";
    b.src="https://static.cloudflareinsights.com/beacon.min.js";
    b.setAttribute("data-cf-beacon",'{"token": "baeb040b9418422b9a4543f89163988a"}');
    document.head.appendChild(b);
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Geist+Mono:wght@400;500&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/assets/css/cursors.css">
<style>
  /* The System 7 bomb alert, in the site's own colors, so it follows the
     light/dark theme like every other page. */
  .desk{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:22px; padding:48px 16px; background:transparent}
  .alert{position:relative; width:min(560px,100%); padding:30px 30px 26px; background:var(--face);
    border:1px solid var(--ink); box-shadow:var(--box-shadow-lg)}
  .alert::before{content:""; position:absolute; inset:3px; border:3px solid var(--ink); pointer-events:none}
  .alert .row{display:flex; gap:22px; align-items:flex-start}
  .bomb{flex:0 0 auto; width:48px; height:48px; color:var(--ink)}
  .bomb .spark{fill:var(--accent-ink)}
  .alert h1{margin:0; font-family:var(--disp); font-size:20px; font-weight:700; letter-spacing:-.01em; line-height:1.3}
  .alert p{margin:10px 0 0; color:var(--dim); font-family:var(--disp); font-size:15px; line-height:1.55}
  .alert .id{margin-top:14px; font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--dim)}
  .btns{display:flex; flex-wrap:wrap; justify-content:flex-end; gap:18px; margin-top:24px}
  .b{min-width:96px; padding:7px 16px; border:1px solid var(--ink); border-radius:8px; background:var(--face);
    color:var(--ink); font-family:var(--pix); font-size:12px; letter-spacing:.06em; text-align:center;
    text-decoration:none}
  /* the default button's thick ring, with a hairline of background between */
  .b.def{box-shadow:0 0 0 2px var(--face),0 0 0 5px var(--ink)}
  /* System 7 showed a pressed button by inverting it */
  .b:hover,.b:active{background:var(--ink); color:var(--face)}
  .b:focus-visible{outline:2px solid var(--accent-ink); outline-offset:8px}
  .where{margin:0; max-width:min(560px,100%); font-family:var(--mono); font-size:11px; letter-spacing:.06em;
    color:var(--dimmer); overflow-wrap:anywhere; text-align:center}
  @media (max-width:420px){
    .alert{padding:26px 22px 22px}
    .alert .row{gap:16px}
    .bomb{width:36px; height:36px}
  }
</style>
</head>
<body>
<div class="crt"></div><div class="vig"></div>

<main class="desk">
  <div class="alert">
    <div class="row">
      <svg class="bomb" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
        <g fill="currentColor"><rect x="9" y="3" width="1" height="1"/><rect x="7" y="4" width="3" height="1"/><rect x="7" y="5" width="3" height="1"/><rect x="3" y="6" width="6" height="1"/><rect x="2" y="7" width="8" height="1"/><rect x="1" y="8" width="2" height="1"/><rect x="4" y="8" width="7" height="1"/><rect x="1" y="9" width="1" height="1"/><rect x="3" y="9" width="8" height="1"/><rect x="1" y="10" width="10" height="1"/><rect x="1" y="11" width="10" height="1"/><rect x="1" y="12" width="10" height="1"/><rect x="1" y="13" width="10" height="1"/><rect x="2" y="14" width="8" height="1"/><rect x="3" y="15" width="6" height="1"/></g>
        <g class="spark"><rect x="10" y="0" width="1" height="1"/><rect x="12" y="0" width="1" height="1"/><rect x="11" y="1" width="1" height="1"/><rect x="10" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/></g>
      </svg>
      <div>
        <h1>Sorry, a system error occurred.</h1>
        <p>That address doesn&rsquo;t lead anywhere on this site. It may have moved when the site was rebuilt.</p>
        <div class="id">PAGE NOT FOUND &nbsp;ID = 404</div>
      </div>
    </div>
    <div class="btns">
      <a class="b" href="/#resume">Resume</a>
      <a class="b def" href="/">Restart</a>
    </div>
  </div>
  <p class="where" id="where"></p>
</main>

<script>
  /* Show the address that was asked for. textContent, never innerHTML: the
     path comes from whoever wrote the link. */
  (function(){
    var el=document.getElementById("where");
    var path=location.pathname;
    try{path=decodeURIComponent(path)}catch(e){}
    if(el) el.textContent=location.host+path;
  })();
</script>
</body>
</html>
